name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ##########################################################################
  # Build & Test
  ##########################################################################
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            gcc \
            flex \
            bison \
            libpthread-stubs0-dev

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  ##########################################################################
  # Build & Test (macOS)
  ##########################################################################
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake flex bison

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  ##########################################################################
  # Build & Test (Windows - experimental)
  ##########################################################################
  build-windows:
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install winflexbison3 cmake

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Debug

  ##########################################################################
  # Fuzz Test (libFuzzer + AddressSanitizer)
  ##########################################################################
  fuzz:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            clang \
            flex \
            bison \
            libpthread-stubs0-dev

      - name: Configure fuzz target
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCDSL_BUILD_FUZZ=ON \
            -DCDSL_GENERATE_DOCS=OFF

      - name: Build fuzz target
        run: cmake --build build --target cdsl_fuzz_parse -j$(nproc)

      - name: Run fuzz target (60 seconds)
        run: |
          mkdir -p build/corpus
          ./build/cdsl_fuzz_parse -max_total_time=60 -max_len=4096 build/corpus

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: ./crash-*

  ##########################################################################
  # Sanitizer Build (AddressSanitizer + UndefinedBehaviorSanitizer)
  ##########################################################################
  sanitize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            gcc \
            flex \
            bison \
            libpthread-stubs0-dev

      - name: Configure with sanitizers
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_C_COMPILER=gcc

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test with sanitizers
        run: ctest --test-dir build --output-on-failure

  ##########################################################################
  # Code Coverage (gcov + lcov)
  ##########################################################################
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            gcc \
            flex \
            bison \
            libpthread-stubs0-dev \
            lcov

      - name: Configure with coverage
        run: cmake -B build -DCDSL_ENABLE_COVERAGE=ON -DCDSL_GENERATE_DOCS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test with coverage
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file build/coverage.info
          lcov --remove build/coverage.info '/usr/*' '*/build/*' '*/tests/*' --output-file build/coverage.info
          lcov --list build/coverage.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.info
          retention-days: 7

  ##########################################################################
  # Static Analysis (cppcheck + scan-build)
  ##########################################################################
  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            gcc \
            clang \
            cppcheck \
            flex \
            bison \
            libpthread-stubs0-dev

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --error-exitcode=0 --std=c23 \
            -I include -I build \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            src/ tests/ demo/ 2>&1 | tee cppcheck-report.txt

      - name: Run scan-build
        run: |
          scan-build -o scan-build-report cmake -B build -DCDSL_GENERATE_DOCS=OFF
          scan-build -o scan-build-report cmake --build build -j$(nproc)

      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.txt
            scan-build-report/
          retention-days: 7

  ##########################################################################
  # Code Format Check
  ##########################################################################
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang-format

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF

      - name: Check formatting
        run: cmake --build build --target check-format

  ##########################################################################
  # Static Analysis (clang-tidy)
  ##########################################################################
  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            gcc \
            flex \
            bison \
            clang-tidy \
            libpthread-stubs0-dev

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run clang-tidy on source files
        run: |
          find src/ -name '*.c' \
            ! -name 'lexer.c' \
            ! -name 'parser.tab.c' \
            | xargs clang-tidy -p build --quiet 2>&1

  ##########################################################################
  # Doxygen Documentation
  ##########################################################################
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            cmake \
            flex \
            bison \
            doxygen \
            graphviz

      - name: Configure
        run: cmake -B build -DCDSL_GENERATE_DOCS=OFF

      - name: Generate documentation
        run: cmake --build build --target doc

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  ##########################################################################
  # Deploy Docs to GitHub Pages
  ##########################################################################
  deploy-docs:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    needs: [docs]
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
